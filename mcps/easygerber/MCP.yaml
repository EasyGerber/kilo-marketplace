id: easygerber
name: EasyGerber
description: Design printed circuit boards with published catalog parts, server-side placement and routing, previews,
  layout checks, and manufacturing exports. Start one guest board without an account, or connect an EasyGerber account.
author: EasyGerber Inc.
url: https://github.com/EasyGerber/easygerber-agent-plugin
category: development
prerequisites:
  - Internet access to EasyGerber's hosted MCP service
  - No EasyGerber account or API key is needed to start a guest board
  - An EasyGerber account and OAuth consent are required for saved account boards
content:
  - name: Remote
    content: |
      {
        "type": "streamable-http",
        "url": "https://www.easygerber.com/api/mcp"
      }
